name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Harness model catalog
        run: npm run catalog:check

      - name: Verify generated platform schema
        run: npm run schema:check

      - name: Unit/integration tests
        run: npm run test:ci

      - name: Agent runtime, BYOK, and Silicon tests
        run: npm run test:agent

      - name: Admin results authorization tests
        run: node --test worker-lib/adminResults.test.mjs worker-lib/surveyResponsePages.test.mjs worker-lib/agent/skillContracts.test.mjs worker-lib/agent/skillHtmlValidate.test.mjs

      - name: Media pipeline smoke
        run: npm run test:media-pipeline

      - name: Check supabase SQL idempotency guards
        run: npm run sql:check

      - name: Re-run incremental launch SQL
        run: |
          npm install --no-save --no-audit --no-fund @electric-sql/pglite
          node scripts/tests/incremental-sql.mjs

      - name: Worker module smoke import
        run: |
          node -e "import('./worker-lib/agent/router.mjs').then((m) => { if (typeof m.handleAgentAndMcpRoutes !== 'function') process.exit(1); })"
          node -e "import('./worker-lib/mcp/server.mjs').then((m) => { if (typeof m.handleMcpRequest !== 'function') process.exit(1); })"
          node -e "import('./worker-lib/silicon/handlers.mjs').then((m) => { if (typeof m.createSiliconRun !== 'function') process.exit(1); })"

      - name: Production build
        run: npm run build

      - name: Worker bundle dry-run
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
