[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spsurvey"
version = "0.1.0"
description = "Python SDK for SP-Survey: build, run and analyse visual perception experiments from code or from an agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Urban Analytics Lab, National University of Singapore" }]
keywords = ["survey", "perception", "urban", "streetscape", "pairwise", "trueskill", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
plot = ["pandas>=1.5", "matplotlib>=3.6"]
test = ["pytest>=8", "pandas>=1.5"]

[project.urls]
Homepage = "https://sp-survey.org"
Documentation = "https://sp-survey.org/docs"
Source = "https://github.com/Sijie-Yang/SP-Survey-Platform/tree/main/sdk/python"

[project.scripts]
spsurvey = "spsurvey.cli:main"

[tool.setuptools]
packages = ["spsurvey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
